name: LanPulseIOS
options:
  bundleIdPrefix: com.lanpulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LanPulseIOS:
    type: application
    platform: iOS
    sources:
      - path: LanPulseIOS
    preBuildScripts:
      - name: Build shared Compose framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanpulse.ios
        TARGETED_DEVICE_FAMILY: "1"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LanPulseIOS/Info.plist
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - LanPulseIOSTests
  LanPulseIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LanPulseIOSTests
    dependencies:
      - target: LanPulseIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanpulse.ios.tests
        GENERATE_INFOPLIST_FILE: YES
