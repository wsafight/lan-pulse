[package]
name = "lanpulse-service"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.0", features = ["v1_0_0"] }
rustix = { version = "1.1.4", features = ["event"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[[bin]]
name = "lanpulse-service"
path = "src/main.rs"

[[bin]]
name = "lanpulse-recv"
path = "src/bin/lanpulse-recv.rs"

[[bin]]
name = "lanpulse-discover"
path = "src/bin/lanpulse-discover.rs"
